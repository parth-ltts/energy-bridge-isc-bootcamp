name: Deploy Toolkit

on:
  push:
    branches:
      - main
    paths:
      - "integrated-supply-chain-training-main/modules/**"
      - "integrated-supply-chain-training-main/config.test.yaml"
      - "integrated-supply-chain-training-main/config.prod.yaml"
      - "integrated-supply-chain-training-main/cdf.toml"
      - ".github/workflows/**"

  workflow_dispatch:
    inputs:
      environment:
        description: Pick one
        required: true
        default: test
        type: choice
        options:
          - test
          - prod

jobs:
  build-modules:
    name: Build & Deploy
    runs-on: ubuntu-latest

    container:
      image: cognite/toolkit:0.8.191

    strategy:
      matrix:
        include:
          - environment: ${{ inputs.environment || 'test' }}

    environment: ${{ matrix.environment }}

    defaults:
      run:
        working-directory: integrated-supply-chain-training-main

    env:
      CDF_PROJECT: cdf-bootcamp-06-${{ matrix.environment }}
      CDF_CLUSTER: westeurope-1

      IDP_TENANT_ID: 16e3985b-ebe8-4e24-9da4-933e21a9fc
      IDP_TOKEN_URL: https://login.microsoftonline.com/16e3985b-ebe8-4e24-9da4-933e21a9fc81/oauth2/v2.0/token
      LOGIN_FLOW: client_credentials

      IDP_CLIENT_ID: ${{ vars.IDP_CLIENT_ID }}
      IDP_CLIENT_SECRET: ${{ secrets.IDP_CLIENT_SECRET }}

      HIERARCHY_PATH_TRIGGER_CLIENT_ID: ${{ vars.HIERARCHY_PATH_TRIGGER_CLIENT_ID }}
      IDP_WF_HIERARCHY_PATH_TRIGGER_SECRET: ${{ secrets.IDP_WF_HIERARCHY_PATH_TRIGGER_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Toolkit authorization
        run: cdf auth verify --no-prompt

      - name: Build Toolkit configurations
        run: cdf build --config-yaml config.${{ matrix.environment }}.yaml

      - name: Deploy Toolkit configurations
        run: cdf deploy